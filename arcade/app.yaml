name: "Meowcana: Swap. Chain. Pounce."
description: |
  Event: NEU SV Hackout
  Track: arcade-track
  Members: Ziyuan Yan (@yanzai-4)
  Summary: A pixel-art tarot roguelike deck-builder. Arrange tarot cards in a row (Swap),
    let neighboring cards boost each other (Chain), then watch Domino the tuxedo cat
    auto-battle the rats (Pounce). Demo: tutorial, Chapter 1 (The Dusty Attic) and Boss Chubbs.
  Run: Import the ZIP into Arduino App Lab, select the UNO Q, and run the app. The first run
    needs Internet access for a few minutes to download and compile the Arduino libraries.
  Controls: Joystick moves the cursor. A = Do (pick up, place, confirm, Fight; in battle it
    cycles speed 1x/2x/4x). B = Back (put a card back, cancel; in battle it skips to the result;
    hold B for 0.6 s on any screen to open the pause Menu). C = Info (explains whatever the cursor is on).
  Setup and calibration: Preassembled arcade console with Modulino Joystick and Buttons on Qwiic
    and the DIYables 3.5-inch TFT. sketch/sketch.ino uses ARCADE_TFT_HX8357D 1 (HX8357D); set it
    to 0 for an RM68140 panel. Requires core arduino:zephyr 1.0.0 and the libraries pinned in
    sketch/sketch.yaml. Joystick calibration in python/preview.py: DEAD_ZONE 26, INVERT_X False,
    INVERT_Y True. Movement is not required. ARCADE_FAST_BUS stays 0 (the direct-GPIO TFT path is
    experimental). Saves are written to the app's data/ folder (run.json, profile.json).
  Known limitations: Demo content only (later chapters are hidden behind a "demo ends here" screen).
    No audio (the console has no speaker). Full-screen scene changes take about one second to repaint
    on this TFT (covered by a transition).
  Credits: Built on the UNO Q arcade starter (github.com/aaishikasb/uno-q-hackout). Libraries:
    Arduino RouterBridge, Arduino Modulino, DIYables TFT Touch Shield, Adafruit GFX. Fonts (SIL OFL 1.1,
    Google Fonts): VT323, Jacquard 24, Jersey 10, Silkscreen. Character sprites generated with PixelLab
    and post-processed in code; all other art drawn in code with Pillow. Implementation assisted by
    AI coding agents.
